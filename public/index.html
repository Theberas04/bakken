<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="description" content="Bakken: QR-stickers voor opbergbakken met de voorraad per bak.">
<title>Bakken</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="overslaan" href="#inhoud">Naar de inhoud</a>
<header id="kop" class="kop" hidden></header>
<main id="inhoud">
  <div id="app">
    <p class="laden">Bakken wordt geladen…</p>
  </div>
</main>
<nav id="balk" class="balk" hidden aria-label="Hoofdmenu"></nav>
<div id="zweef" class="zweef" hidden></div>
<script src="/lib/qrcode.js"></script>
<script src="/lib/qr.js"></script>
<script src="/app.js"></script>
<script>
  // De schil in de cache zetten, zodat de app en een gescande sticker ook
  // zonder internet openen. Lukt het niet, dan werkt de app gewoon door.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
